<!DOCTYPE html>
<html lang="en">
<head>
    <!-- =========================================================
         THE SOUL OF RAMEN
         Frontend Challenge: Comfort Food Edition
         HTML5 + CSS Art + Minimal JavaScript
    ========================================================== -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Soul of Ramen | CSS Art</title>

    <meta
        name="description"
        content="A cinematic CSS artwork celebrating comfort food through handcrafted HTML and CSS."
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/background.css">
    <link rel="stylesheet" href="css/table.css">
    <link rel="stylesheet" href="css/lantern.css">
    <link rel="stylesheet" href="css/bowl.css">
    <link rel="stylesheet" href="css/broth.css">
    <link rel="stylesheet" href="css/noodles.css">
    <link rel="stylesheet" href="css/egg.css">
    <link rel="stylesheet" href="css/steam.css">
    <link rel="stylesheet" href="css/particles.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chopsticks.css">
    <link rel="stylesheet" href="css/spoon.css">
</head>

<body>

<div class="scene">

    <!-- ==========================================
                    BACKGROUND
    =========================================== -->

    <div class="background">

        <div class="sky-gradient"></div>

        <div class="moon-glow"></div>

        <div class="fog fog-1"></div>
        <div class="fog fog-2"></div>
        <div class="fog fog-3"></div>

        <div class="rain"></div>

        <div class="vignette"></div>

    </div>


    <!-- ==========================================
                    FLOATING PARTICLES
    =========================================== -->

    <div class="particles">

        <span class="particle p1"></span>
        <span class="particle p2"></span>
        <span class="particle p3"></span>
        <span class="particle p4"></span>
        <span class="particle p5"></span>
        <span class="particle p6"></span>
        <span class="particle p7"></span>
        <span class="particle p8"></span>
        <span class="particle p9"></span>
        <span class="particle p10"></span>

    </div>


    <!-- ==========================================
                    LANTERN
    =========================================== -->

   <header class="hero">

    <div class="lantern lantern-left">

        <div class="lantern-rope"></div>

        <div class="lantern-top"></div>

        <div class="lantern-body">

            <span></span>
            <span></span>
            <span></span>

        </div>

        <div class="lantern-bottom"></div>

        <div class="lantern-glow"></div>

    </div>

    <div class="lantern lantern-right">

        <div class="lantern-rope"></div>

        <div class="lantern-top"></div>

        <div class="lantern-body">

            <span></span>
            <span></span>
            <span></span>

        </div>

        <div class="lantern-bottom"></div>

        <div class="lantern-glow"></div>

    </div>

    <div class="hero-text">

        <p class="subtitle">
            Comfort Food Edition
        </p>

        <h1>
            The Soul
            <span>of Ramen</span>
        </h1>

        <p class="description">
            Comfort isn't just food.
            It's a feeling.
        </p>

    </div>

</header>


    <!-- ==========================================
                    MAIN ARTWORK
    =========================================== -->

    <main class="artwork">

        <!-- STEAM -->

       <section class="steam-container" aria-hidden="true">

    <span class="steam s1"></span>
    <span class="steam s2"></span>
    <span class="steam s3"></span>
    <span class="steam s4"></span>
    <span class="steam s5"></span>
    <span class="steam s6"></span>
    <span class="steam s7"></span>
    <span class="steam s8"></span>
    <span class="steam s9"></span>
    <span class="steam s10"></span>
    <span class="steam s11"></span>
    <span class="steam s12"></span>
    <span class="steam s13"></span>
    <span class="steam s14"></span>
    <span class="steam s15"></span>
    <span class="steam s16"></span>
    <span class="steam s17"></span>
    <span class="steam s18"></span>
    <span class="steam s19"></span>
    <span class="steam s20"></span>

</section>


        <!-- BOWL -->

        <section
            class="bowl-wrapper"
            aria-label="Handcrafted CSS ramen bowl">

            <div class="bowl-shadow"></div>

            <div class="bowl">

                <!-- BROTH -->

                <div class="broth">

                    <div class="broth-highlight"></div>

                    <div class="broth-ripple"></div>

                </div>


                <!-- NOODLES -->

                <div class="noodles">

                    <span class="noodle n1"></span>
                    <span class="noodle n2"></span>
                    <span class="noodle n3"></span>
                    <span class="noodle n4"></span>
                    <span class="noodle n5"></span>
                    <span class="noodle n6"></span>
                    <span class="noodle n7"></span>
                    <span class="noodle n8"></span>

                </div>


                <!-- EGG -->

                <div class="egg">

                    <div class="egg-white"></div>

                    <div class="egg-yolk"></div>

                    <div class="egg-shine"></div>

                </div>


                <!-- SEAWEED -->

                <div class="seaweed">

    <span></span>

    <span></span>

    <span></span>

</div>

                <!-- SPRING ONION -->

               <div class="spring-onions">

<span class="onion o1"></span>

<span class="onion o2"></span>

<span class="onion o3"></span>

<span class="onion o4"></span>

<span class="onion o5"></span>

<span class="onion o6"></span>

</div>


                <!-- SESAME -->

                <div class="sesame">

<span class="s1"></span>

<span class="s2"></span>

<span class="s3"></span>

<span class="s4"></span>

<span class="s5"></span>

<span class="s6"></span>

<span class="s7"></span>

<span class="s8"></span>

</div>

            </div>


            <!-- CHOPSTICKS -->

            <div class="chopsticks">

                <div class="stick stick-left"></div>

                <div class="stick stick-right"></div>

            </div>


            <!-- SPOON -->

            <div class="spoon">

                <div class="spoon-handle"></div>

                <div class="spoon-head"></div>

            </div>

        </section>


        <!-- TABLE -->

        <section
            class="table"
            aria-hidden="true">

            <div class="table-light"></div>

            <div class="reflection"></div>

        </section>

    </main>


    <!-- ==========================================
                    FOOTER
    =========================================== -->

    <footer>

        <p>
            Crafted entirely with HTML & CSS.
        </p>

    </footer>

</div>

<script src="js/app.js"></script>

</body>
</html>
